# =====================================================================
# PawLink Backend Configuration
# =====================================================================
server.port=8080
spring.application.name=pawlink-backend

# Database Configuration
# Defaults to zero-setup embedded H2 in PostgreSQL compatibility mode.
# When connecting to Supabase or local PostgreSQL, pass SPRING_DATASOURCE_URL or application-local.properties.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:pawlink;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# Automatic Schema & Seed Data Initialization
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:seed.sql
spring.sql.init.continue-on-error=true

# Connection Pooling (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# JSON Formatting
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.serialization.indent-output=true
