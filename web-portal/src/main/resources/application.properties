# =====================================================================
# PawLink Web Portal Configuration (Port 8081)
# =====================================================================
server.port=8081
spring.application.name=pawlink-web-portal

# Backend API Configuration
pawlink.api.base-url=http://localhost:8080

# Thymeleaf Cache (disable for development reloading)
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
