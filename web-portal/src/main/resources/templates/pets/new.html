<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('PawLink - Register Pet')}">
    <title>PawLink - Register Pet</title>
</head>
<body>

<nav th:replace="~{layout :: navbar}"></nav>

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <i class="bi bi-patch-plus-fill text-primary" style="font-size: 2.8rem;"></i>
                        <h3 class="fw-bold text-dark mt-2">Register Your Pet</h3>
                        <p class="text-muted small">Provide basic pet info to get tailored clinical care guidelines.</p>
                    </div>

                    <!-- Inline Error Display -->
                    <div th:if="${errorMessage}" class="alert alert-danger d-flex align-items-center mb-4" role="alert">
                        <i class="bi bi-exclamation-octagon-fill me-2 fs-5"></i>
                        <div th:text="${errorMessage}">Validation Error</div>
                    </div>

                    <form th:action="@{/pets/new}" method="post">
                        <!-- Pet Name -->
                        <div class="mb-3">
                            <label for="name" class="form-label fw-semibold">Pet Name <span class="text-danger">*</span></label>
                            <input type="text" class="form-control form-control-lg" id="name" name="name"
                                   th:value="${name}" placeholder="e.g. Buddy, Whiskers, Bella" required autofocus>
                        </div>

                        <!-- Species Dropdown -->
                        <div class="mb-3">
                            <label for="species" class="form-label fw-semibold">Species <span class="text-danger">*</span></label>
                            <select class="form-select form-select-lg" id="species" name="species" required>
                                <option value="" disabled th:selected="${selectedSpecies == null}">Select species...</option>
                                <option th:each="sp : ${speciesList}"
                                        th:value="${sp}"
                                        th:text="${sp}"
                                        th:selected="${sp == selectedSpecies}">Dog</option>
                            </select>
                            <div class="form-text">Supported species: Dog, Cat, Bird, Reptile.</div>
                        </div>

                        <!-- Date of Birth Picker -->
                        <div class="mb-4">
                            <label for="dob" class="form-label fw-semibold">Date of Birth <span class="text-danger">*</span></label>
                            <input type="date" class="form-control form-control-lg" id="dob" name="dob"
                                   th:value="${dob != null ? dob : defaultDob}" required>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-lg shadow-sm">
                                <i class="bi bi-check2-circle me-1"></i> Register Pet
                            </button>
                            <a href="/pets" class="btn btn-outline-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{layout :: footer}"></footer>

</body>
</html>
