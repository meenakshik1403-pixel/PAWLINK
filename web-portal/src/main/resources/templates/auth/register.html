<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head(~{::title})}">
    <title>PawLink - Register</title>
</head>
<body>

<div th:replace="~{layout :: navbar}"></div>

<div class="container my-auto py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card p-4 shadow-sm">
                <div class="text-center mb-4">
                    <h3 class="fw-bold text-primary"><i class="bi bi-paw-fill"></i> PawLink</h3>
                    <p class="text-muted small">Create an Owner or Sitter account</p>
                </div>

                <div th:if="${errorMessage}" class="alert alert-danger py-2 small" role="alert" th:text="${errorMessage}">
                    Error message placeholder
                </div>

                <form th:action="@{/register}" method="post">
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Full Name</label>
                        <input type="text" name="name" class="form-control" placeholder="Jane Smith" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Email address</label>
                        <input type="email" name="email" class="form-control" placeholder="jane@example.com" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Password</label>
                        <input type="password" name="password" class="form-control" placeholder="At least 6 characters" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Phone Number</label>
                        <input type="text" name="phone" class="form-control" placeholder="+1-555-0199">
                    </div>
                    <div class="mb-4">
                        <label class="form-label small fw-semibold">Register As</label>
                        <select name="role" class="form-select" required>
                            <option value="OWNER" selected>Pet Owner</option>
                            <option value="SITTER">Pet Sitter</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Create Account</button>
                </form>

                <div class="text-center mt-3">
                    <span class="small text-muted">Already have an account? </span>
                    <a th:href="@{/login}" class="small text-decoration-none fw-semibold">Sign In</a>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{layout :: footer}"></div>

</body>
</html>
