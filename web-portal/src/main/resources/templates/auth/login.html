<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head(~{::title})}">
    <title>PawLink - Login</title>
</head>
<body>

<div th:replace="~{layout :: navbar}"></div>

<div class="container my-auto py-5">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card p-4 shadow-sm">
                <div class="text-center mb-4">
                    <h3 class="fw-bold text-primary"><i class="bi bi-paw-fill"></i> PawLink</h3>
                    <p class="text-muted small">Sign in to your pet care portal</p>
                </div>

                <div th:if="${errorMessage}" class="alert alert-danger py-2 small" role="alert" th:text="${errorMessage}">
                    Error message placeholder
                </div>

                <form th:action="@{/login}" method="post">
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Email address</label>
                        <input type="email" name="email" class="form-control" placeholder="name@example.com" required value="owner.john@pawlink.com">
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Password</label>
                        <input type="password" name="password" class="form-control" required value="password123">
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Sign In</button>
                </form>

                <div class="text-center mt-3">
                    <span class="small text-muted">Don't have an account? </span>
                    <a th:href="@{/register}" class="small text-decoration-none fw-semibold">Register here</a>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{layout :: footer}"></div>

</body>
</html>
