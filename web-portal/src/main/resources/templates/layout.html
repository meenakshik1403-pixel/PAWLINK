<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:replace="${title}">PawLink - Pet Care</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background-color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .navbar-brand {
            font-weight: 700;
            color: #4f46e5 !important;
        }
        .footer {
            margin-top: auto;
            background: #ffffff;
            border-top: 1px solid #e2e8f0;
        }
        .card {
            border: 1px solid #e2e8f0;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
            border-radius: 0.75rem;
        }
    </style>
</head>
<body>

<!-- ===================================================================== -->
<!-- SHARED NAVBAR FRAGMENT (Edited only by Person 1 - Team Lead)         -->
<!-- ===================================================================== -->
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
    <div class="container-fluid px-4">
        <a class="navbar-brand text-white fw-bold" href="/">
            <i class="bi bi-paw-fill text-primary me-1"></i> PawLink
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <!-- Dynamic Navigation Links by Role -->
            <ul class="navbar-nav me-auto mb-2 mb-lg-0" th:if="${session.user != null}">
                <!-- Owner Links -->
                <li class="nav-item" th:if="${session.user.role == 'OWNER'}">
                    <a class="nav-link" href="/pets"><i class="bi bi-heart me-1"></i> My Pets</a>
                </li>
                <li class="nav-item" th:if="${session.user.role == 'OWNER'}">
                    <a class="nav-link" href="/appointments"><i class="bi bi-calendar-event me-1"></i> Vet Appointments</a>
                </li>
                <li class="nav-item" th:if="${session.user.role == 'OWNER'}">
                    <a class="nav-link" href="/sitters"><i class="bi bi-person-badge me-1"></i> Find Sitter</a>
                </li>
                <li class="nav-item" th:if="${session.user.role == 'OWNER'}">
                    <a class="nav-link" href="/reminders"><i class="bi bi-bell me-1"></i> Reminders</a>
                </li>
                <li class="nav-item" th:if="${session.user.role == 'OWNER'}">
                    <a class="nav-link" href="/payments"><i class="bi bi-credit-card me-1"></i> Payments</a>
                </li>

                <!-- Sitter Links -->
                <li class="nav-item" th:if="${session.user.role == 'SITTER'}">
                    <a class="nav-link" href="/bookings"><i class="bi bi-briefcase me-1"></i> My Bookings</a>
                </li>

                <!-- Admin Links -->
                <li class="nav-item" th:if="${session.user.role == 'ADMIN'}">
                    <a class="nav-link" href="/admin/sitters"><i class="bi bi-check-circle me-1"></i> Approve Sitters</a>
                </li>
                <li class="nav-item" th:if="${session.user.role == 'ADMIN'}">
                    <a class="nav-link" href="/admin/stats"><i class="bi bi-graph-up me-1"></i> Platform Stats</a>
                </li>
            </ul>

            <!-- Right-hand User Context & Logout -->
            <ul class="navbar-nav ms-auto align-items-center">
                <li class="nav-item dropdown" th:if="${session.user != null}">
                    <a class="nav-link dropdown-toggle text-light" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown">
                        <i class="bi bi-person-circle me-1"></i>
                        <span th:text="${session.user.name}">User Name</span>
                        <span class="badge bg-primary ms-1" th:text="${session.user.role}">ROLE</span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end shadow">
                        <li><a class="dropdown-item text-danger" href="/logout"><i class="bi bi-box-arrow-right me-2"></i>Logout</a></li>
                    </ul>
                </li>
                <li class="nav-item" th:if="${session.user == null}">
                    <a class="btn btn-outline-light btn-sm me-2" href="/login">Login</a>
                </li>
                <li class="nav-item" th:if="${session.user == null}">
                    <a class="btn btn-primary btn-sm" href="/register">Register</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Shared Footer -->
<footer th:fragment="footer" class="footer py-3 text-center text-muted small">
    <div class="container">
        <span>&copy; 2026 PawLink Pet Care Management System. Team Architecture (P1-P8).</span>
    </div>
    <!-- Bootstrap JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</footer>

</body>
</html>
